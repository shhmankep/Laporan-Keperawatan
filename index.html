<!doctype html>
<html lang="id"><head><meta charset="utf-8">

<title>Laporan Harian Kepala Ruangan</title>
<style>
:root{--ink:#0f2e3d;--mut:#4f6b78;--teal:#1565d8;--mint:#e3f8ec;--grn:#22c55e;--gd:#16b364;--bg:#ffffff;--line:#e3ebf5;--or:#f59e0b;--pu:#7c4dff;--cy:#06b6d4;--sh:0 2px 12px rgba(21,101,216,.09);--red:#c4452d;--amb:#b7791f;--w:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:70px}
header{background:var(--w);box-shadow:var(--sh);color:var(--ink);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--grn)}
header img{height:42px;width:auto;display:block}header h1{font-size:17px;margin:0;flex:1;min-width:170px;line-height:1.25;color:var(--teal);padding-left:14px;border-left:1px solid var(--line)}header small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.hb{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:8px;padding:8px 14px;color:#fff;cursor:pointer;background:var(--teal)}.hb.g{background:var(--gd)}
#pill{font-size:12px;padding:5px 11px;border-radius:99px;background:#f3f6fa;border:1px solid var(--line);color:var(--mut);font-weight:600;cursor:pointer}#pill:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grn);margin-right:6px}
#pill.bad{color:#b4321c;background:#fdeceb}#pill.bad:before{background:var(--red)}#pill.wait{color:#8a5a00;background:#fff6e0}#pill.wait:before{background:var(--or)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--w);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:13px 4px;font:inherit;font-weight:600;color:var(--mut);border-top:3px solid transparent}

main{max-width:1000px;margin:0 auto;padding:14px}section{display:none}section.on{display:block}
h2{font-size:16px;margin:20px 0 8px;padding-bottom:4px;color:var(--teal);border-bottom:2px solid var(--grn)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button.b{font:inherit;color:inherit}
input:not([type=radio]),select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--w);margin-top:3px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
.bar input[type=date]{width:auto}
.b{padding:10px 16px;border-radius:8px;border:1px solid var(--teal);background:var(--teal);color:#fff;font-weight:600;cursor:pointer}.b.o{background:var(--w);color:var(--teal)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.sum div{--c:var(--teal);background:var(--w);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;box-shadow:var(--sh);padding:10px 12px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}.sum b{display:block;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:0;color:var(--c)}.sum small{display:block;font-size:12px;font-weight:400;letter-spacing:0;text-transform:none}
.sum div:nth-child(2){--c:var(--gd)}.sum div:nth-child(3){--c:var(--or)}.sum div:nth-child(4){--c:var(--pu)}.sum div:nth-child(5){--c:var(--cy)}.sum div:nth-child(6){--c:#e11d74}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{text-align:left;background:var(--w);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.tile.ok{border-top-color:var(--grn)}.tile.warn{border-top-color:var(--or)}.tile.none{box-shadow:none;border-style:dashed;border-top-style:solid;color:var(--mut)}
.tile b{font-size:16px}.tile .st{font-size:12px;color:var(--mut);margin:2px 0 6px}
.tile .n{display:flex;gap:14px;font-size:13px}.tile .n span b{font-size:15px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#fff1d6;color:#9a5b00}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
fieldset{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:6px 10px;background:var(--w)}legend{font-size:13px;font-weight:700;padding:0 4px}
.ch{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;font-size:14px;color:var(--ink);font-weight:500}
.ch input{width:18px;height:18px;margin:0}
.card{box-shadow:var(--sh);background:var(--w);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.shift{border-left:4px solid var(--grn)}output{font-weight:700;color:var(--teal)}
.li{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--w);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;font:inherit;color:inherit;cursor:pointer}
.li small{color:var(--mut)}.tag{font-size:11px;font-weight:700;color:var(--amb)}
dialog{width:min(860px,96vw);max-height:92vh;padding:0;border:0;border-radius:14px;overflow:hidden}
#dt{max-height:76vh;overflow:auto}.dact{margin:0;padding:12px 16px;border-top:1px solid var(--line);background:#fff}
.rh{background:linear-gradient(135deg,#1565d8,#16b364);color:#fff;padding:16px 18px}.rh h3{margin:0;font-size:21px}.rh p{margin:3px 0 0;font-size:13px}
.rb{padding:14px 18px 18px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kp div{border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}.kp div:nth-child(2){border-top-color:var(--gd)}.kp div:nth-child(3){border-top-color:var(--pu)}.kp div:nth-child(4){border-top-color:var(--or)}.kp b{display:block;font-size:22px;color:var(--teal);text-transform:none}
.rs h4{margin:18px 0 8px;color:var(--teal);font-size:14px;display:flex;gap:8px;align-items:center}.rs h4 i{background:var(--teal);color:#fff;border-radius:6px;font-style:normal;font-size:12px;padding:1px 9px}.rs p{margin:12px 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}thead th{background:#e8f1fd;color:var(--teal)}thead small{font-weight:400;color:var(--mut)}tbody th{text-align:left;background:#f6faf8;font-weight:600}
.bd{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}.bd.g{background:#dcf7e7;color:#0d7a40}.bd.r{background:#fde2de;color:#b4321c}.bd.a{background:#fff1d6;color:#9a5b00}.bd.b{background:#e0ecfd;color:#1252b0}.bd.n{background:#eef2f5;color:var(--mut)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.tx{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;white-space:pre-wrap;font-size:14px}.tx small{display:block;color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase}.tx.w{background:#fff8e8;border-color:#f3d9a0}
.b.dl{background:#fff;color:var(--red);border-color:var(--red);margin-left:auto}
.sc{overflow-x:auto;margin:6px 0}.ft{min-width:100%;font-size:13px}.ft th{text-align:left;font-weight:600;background:#fff}.ft thead th{text-align:center;background:#e8f1fd;color:var(--teal)}.ft tbody th{position:sticky;left:0;min-width:130px}.ft .hr th{background:#e8f1fd;color:var(--teal)}.ft .sb th{font-weight:400;padding-left:18px}.ft td{padding:3px}.ft input{margin:0;padding:6px 4px;text-align:center;min-width:46px;border-radius:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
pre{white-space:pre-wrap;font:inherit;max-height:60vh;overflow:auto;margin:0 0 12px}
.ins{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:8;background:#fff;border:1px solid var(--line);border-left:5px solid var(--gd);border-radius:12px;box-shadow:0 6px 24px rgba(21,101,216,.22);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:560px;margin:0 auto}.ins[hidden]{display:none}.ins img{width:40px;height:40px;border-radius:9px}.ins span{flex:1;min-width:180px;font-size:13px}.ins .b{padding:8px 14px}
#toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}#toast.on{opacity:1}
.hint{font-size:13px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><img src="logo.png" alt="Surya Husadha"><h1>Laporan Harian Kepala Ruangan<small>Dashboard ruang rawat</small></h1><button id="pill" aria-live="polite"></button><button class="hb" id="hf">+ Isi laporan</button><button class="hb g" id="hs">Sinkron</button></header>
<main>
<section id="v-dash" class="on">
 <div class="bar"><label>Tanggal<input type="date" id="dd"></label><button class="b o" id="today">Hari ini</button></div>
 <div class="sum" id="sum"></div><div class="grid" id="grid"></div>
</section>
<section id="v-form"><form id="f"></form></section>
<section id="v-riw"><div class="bar"><label>Ruang<select id="rf"></select></label><label>Dari tanggal<input type="date" id="r1"></label><label>Sampai tanggal<input type="date" id="r2"></label></div>
 <div class="bar"><button class="b" id="rx">Unduh Excel</button><button class="b o" id="rp">Cetak / PDF</button><span class="hint" id="rn"></span></div><div id="rl"></div></section>
<section id="v-set">
 <h2>Sinkron ke Google Drive</h2>
 <label>Alamat sinkron Google Drive (sudah terisi otomatis)<input id="cu" placeholder="https://script.google.com/macros/s/.../exec"></label>
 <input id="ct" type="hidden">
 <h2>Bawaan perangkat ini</h2>
 <div class="row2"><label>Nama kepala ruangan<input id="ck"></label><label>Ruang<select id="cr"></select></label></div>
 <p><button class="b" id="cs">Simpan &amp; sinkron</button></p>

 <p class="hint">Untuk memasang: buka menu browser lalu pilih "Tambahkan ke layar utama" / "Install app".</p>
</section>
</main>
<nav><button data-v="dash" class="on">Dashboard</button><button data-v="form">Isi laporan</button><button data-v="riw">Riwayat</button><button data-v="set">Pengaturan</button></nav>
<dialog id="dlg"><div id="dt"></div><div class="bar dact"><button class="b" id="de">Ubah</button><button class="b o" id="dc">Salin teks</button><button class="b o" id="dx">Tutup</button><button class="b dl" id="dl">Hapus</button></div></dialog>
<div class="ins" id="ins" hidden><img src="icon-192.png" alt=""><span id="it"></span><button class="b" id="ib" hidden>Pasang</button><button class="b o" id="in">Nanti</button></div>
<div id="toast"></div>
<script>
const RUANG=["Ruang Bayi","Ruang Gambuh A","Ruang Gambuh B","Ruang Gambuh C","Ruang HD","Ruang IGD","Ruang Intensif","Ruang Lantai 3","Ruang Lantai 4","Ruang OK","Ruang Poliklinik","Ruang VK"];
const SH=[["pagi","Pagi","07.30-13.30"],["sore","Sore","13.30-19.30"],["malam","Malam","19.30-07.30"]];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const S={cfg:LS("cfg")||{url:"",token:"",kepala:"",ruang:""},local:LS("local")||{},remote:LS("remote")||{},queue:LS("queue")||[],del:LS("del")||[],err:""};
const DEF="https://script.google.com/macros/s/AKfycbw7KZwlOASPcOTTwkHDkCVc1mc5CzHS9E-T-8-q31o1cA_RBJgUhpEHTLVKAArLQhO__Q/exec";if(!S.cfg.custom)S.cfg.url=DEF;
const persist=()=>["cfg","local","remote","queue","del"].forEach(k=>localStorage.setItem(k,JSON.stringify(S[k])));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const tglID=t=>new Date(t+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const v=x=>x===undefined||x===""||x===null?"-":x;
const toast=m=>{const t=$("#toast");t.textContent=m;t.className="on";setTimeout(()=>t.className="",Math.max(2400,m.length*70))};
const all=()=>{const m={...S.remote};for(const k in S.local)if(!m[k]||(S.local[k].ts||0)>=(m[k].ts||0))m[k]=S.local[k];S.del.forEach(k=>delete m[k]);return m};

/* ---------- Form ---------- */
const N=(n,l)=>`<label>${l}<input type="number" min="0" inputmode="numeric" name="${n}"></label>`;
const T=(n,l,x="")=>`<label>${l}<input name="${n}" ${x}></label>`;
const A=(n,l)=>`<label>${l}<textarea name="${n}" rows="3"></textarea></label>`;
const R=(n,l,o)=>`<fieldset><legend>${l}</legend>${o.map(x=>`<label class="ch"><input type="radio" name="${n}" value="${x}">${x}</label>`).join("")}</fieldset>`;
const ST=["Ideal","Kurang Tenaga","Berlebih"];
let curFmt="ri";
const PAY=[["umum","Umum"],["asuransi","Asuransi"],["iks","IKS"],["she","SHE"],["bpjs","BPJS"]],PAYT=[...PAY,["travelling","Travelling"]],S3=["pagi","sore","malam"];
const SL={pagi:"Pagi",sore:"Sore",malam:"Malam",midle:"Midle",cito:"Cito"},TN4=[["",null,["pagi","sore","midle","malam"]]];
const J={
 igd:{sh:S3,it:[["pasien","Jumlah Pasien",PAY],["infus","Pasang Infus"],["cath","Pasang Catheter"],["oncall","On Call"],["mrs","Jumlah Pasien MRS",PAY],["ok","Jumlah Pasien OK",[["mrs","MRS"],["odc","ODC"]]],["eswl","Jumlah Pasien ESWL",PAY],["pulang","Jumlah Pasien Pulang"],["meninggal","Jumlah Pasien Meninggal"],["doa","Jumlah Pasien DOA"],["rujuk","Jumlah Pasien yang Dirujuk"],["terima","Jumlah Menerima Rujukan Pasien dari RS Lain"],["emerg","Jumlah Pasien Emergency",PAY],["false","Jumlah Pasien False Emergency",PAY],["o2","Jumlah Pasien Memakai Oksigen"]],tn:TN4},
 hd:{sh:["pagi","sore","cito"],it:[["pasien","Jumlah Pasien",PAYT],["hd","Jumlah Tindakan HD",PAY],["capd","Jumlah Tindakan CAPD",PAY],["dl","Pasang Double Lumen"],["av","Pasang AV Shunt"],["mrs","Jumlah Pasien MRS",PAY],["pulang","Jumlah Pasien Pulang"],["o2","Jumlah Pasien Memakai Oksigen"],["hb","Jumlah Pasien yang Mendapatkan Obat Hb"],["trf","Jumlah Pasien yang Mendapatkan Transfusi"]],tn:[["",null,["pagi","sore","cito"]]]},
 ok:{sh:S3,it:[["pasien","Jumlah Pasien",PAY],["elektif","Jumlah Tindakan Elektif",PAY],["cito","Jumlah Tindakan Cito",PAY],["stwc","Jumlah Tindakan STWC",PAY],["mrs","Jumlah Pasien MRS",PAY],["pulang","Jumlah Pasien Pulang"]],tn:[["bedah","Bedah",S3],["anestesi","Anestesi",S3]]},
 bayi:{sh:S3,it:[["pasien","Jumlah Pasien",PAY],["status","Status Bayi",[["sehat","Bayi Sehat"],["nicu","NICU"],["resti","Bayi Resti"],["foto","Fototerapi"]]],["shk","Jumlah Tindakan SHK",PAY],["infus","Jumlah Pasien Pasang Infus"],["vent","Jumlah Pasien Pasang Ventilator"],["cpap","Jumlah Pasien Pasang CPAP"],["pulang","Jumlah Pasien Pulang"],["rujuk","Jumlah Pasien Dirujuk",PAY],["o2","Jumlah Pasien Memakai Oksigen"],["trf","Jumlah Pasien yang Mendapatkan Transfusi"]],tn:[["",null,S3]]},
 vk:{sh:S3,it:[["pasien","Jumlah Pasien",PAY],["normal","Jumlah Tindakan Persalinan Normal",PAY],["sc","Jumlah Tindakan Persalinan SC",PAY],["pato","Jumlah Tindakan Persalinan Patologi",PAY],["gynp","Jumlah Pasien Gynecology"],["gynt","Jumlah Tindakan Gynecology",PAY],["infus","Jumlah Pasien Pasang Infus"],["cath","Jumlah Pasien Pasang Catheter"],["mrs","Jumlah Pasien MRS",PAY],["pulang","Jumlah Pasien Pulang"],["o2","Jumlah Pasien Memakai Oksigen"],["trf","Jumlah Pasien yang Mendapatkan Transfusi"]],tn:[["",null,S3]]},
 poli:{sh:[],it:[],tn:TN4}};
const RFMT={"Ruang Bayi":"bayi","Ruang HD":"hd","Ruang IGD":"igd","Ruang OK":"ok","Ruang Poliklinik":"poli","Ruang VK":"vk"},fmtOf=n=>RFMT[n]||"ri";
const SHEET={ri:"Rekap Laporan",igd:"Rekap IGD",hd:"Rekap Hemodialisis",ok:"Rekap Ruang Operasi",bayi:"Rekap Neonatus",vk:"Rekap Ruang Bersalin",poli:"Rekap Poliklinik"};
const XN={ri:"Rawat Inap",igd:"IGD",hd:"Hemodialisis",ok:"Operasi dan Bedah",bayi:"Neonatus",vk:"Ruang Bersalin",poli:"Poliklinik"};
const SP=["SP THT","OBGYN","BEDAH UMUM","BEDAH ANAK","BEDAH SARAF","BEDAH UROLOGI","BEDAH ONCOLOGI","BEDAH TULANG","BEDAH DIGESTIF","BEDAH THORAX","BEDAH PLASTK","SP SARAF","INTERNA","SP ANAK","SP KULIT KELAMIN","SP MATA","SP PARU","SP JANTUNG","SP JIWA","SP GIZI KLINIK","HEMATOLOGI ONK"];
const TP=["POLI UMUM DAN IKS","POLI SPESIALIS","POLI GIGI","POLI FISIOTERAPI","REHAB MEDIK","POLI GIGI SPESIALIS","POLI GIGI SPESIALIS EDONDONSI","POLI GIGI SPESIALIS PERIODONTI","POLI GIGI SPESIALIS PEDODONTIS","IMUNISASI"],PP=[["iks","IKS"],["hc","HC"],["umum","UMUM"],["bpjs","BPJS"]];
const IKPS=[["kpcs","KPCS"],["knc","KNC"],["ktc","KTC"],["ktd","KTD"],["sentinel","SENTINEL"]];
const SKPN=[["s1","SKP 1 (Mengidentifikasi Pasien dengan Benar)"],["s2","SKP 2 (Meningkatkan Komunikasi yang Efektif)"],["s3","SKP 3 (Meningkatkan Keamanan Obat yang Harus Diwaspadai)"],["s4","SKP 4 (Memastikan Lokasi, Prosedur, dan Pasien yang Benar pada Tindakan Bedah)"],["s5","SKP 5 (Mengurangi Risiko Infeksi Akibat Perawatan Kesehatan)"],["s6","SKP 6 (Mengurangi Risiko Cedera Pasien Akibat Jatuh)"]];
const nv=x=>+x||0,nin=n=>`<input type="number" min="0" inputmode="numeric" name="${n}">`,tnp=(g,s)=>g?`tn.${g}.${s}`:`tn.${s}`;
const secTn=D=>`<b>Kecukupan tenaga</b>`+D.tn.map(([g,gl,sh])=>(gl?`<p class="hint" style="margin:10px 0 2px"><b>${gl}</b></p>`:"")+sh.map(s=>{const p=tnp(g,s);return`<div class="card shift"><b>${SL[s]}</b><div class="row2">${N(p+".jml","Jumlah tenaga (orang)")}</div>${s==="cito"?"":R(p+".status","Status ketenagaan",ST)}${T(p+".ket","Keterangan")}</div>`}).join("")).join("");
function secJ(f){const D=J[f];let t=`<h2>I. Data situasional &amp; ketenagaan</h2><div class="sc"><table class="ft"><thead><tr><th></th>${D.sh.map(s=>`<th>${SL[s]}</th>`).join("")}</tr></thead><tbody>`;
 D.it.forEach(([k,l,sub])=>{if(sub)t+=`<tr class="hr"><th colspan="${D.sh.length+1}">${l}</th></tr>`+sub.map(([sk,sl])=>`<tr class="sb"><th>${sl}</th>${D.sh.map(s=>`<td>${nin(`d.${k}.${sk}.${s}`)}</td>`).join("")}</tr>`).join("");else t+=`<tr class="hr"><th>${l}</th>${D.sh.map(s=>`<td>${nin(`d.${k}.${s}`)}</td>`).join("")}</tr>`});
 return t+`</tbody></table></div>`+secTn(D)}
